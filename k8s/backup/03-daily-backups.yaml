apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bank-a-daily
  namespace: banking
spec:
  schedule: 0 0 0 * * *
  immediate: true
  backupOwnerReference: self
  cluster:
    name: bank-a
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
