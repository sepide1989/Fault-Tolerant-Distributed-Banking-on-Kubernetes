apiVersion: v1
kind: Service
metadata:
  name: bank-a
  namespace: banking
  annotations: {prometheus.io/scrape: 'true', prometheus.io/port: '8000', prometheus.io/path: /metrics}
spec:
  selector: {app: bank-a}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: bank-b
  namespace: banking
  annotations: {prometheus.io/scrape: 'true', prometheus.io/port: '8000', prometheus.io/path: /metrics}
spec:
  selector: {app: bank-b}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking
  annotations: {prometheus.io/scrape: 'true', prometheus.io/port: '8000', prometheus.io/path: /metrics}
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{name: http, port: 8000, targetPort: 8000, nodePort: 30080}]
