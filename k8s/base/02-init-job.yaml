apiVersion: batch/v1
kind: Job
metadata:
  name: bank-init-v3
  namespace: banking
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: bank-init}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: banking-app:v3
        imagePullPolicy: IfNotPresent
        command: ['python','-m','gateway.entrypoint_k8s']
        env:
        - name: ROLE
          value: bootstrap
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: bank-db-credentials, key: username}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: bank-db-credentials, key: password}}
        resources:
          requests: {cpu: 100m, memory: 96Mi}
          limits: {cpu: 400m, memory: 256Mi}
