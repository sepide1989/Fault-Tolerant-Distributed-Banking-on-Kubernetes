apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: bank-a, namespace: banking}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: bank-a}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 45}}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: bank-b, namespace: banking}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: bank-b}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 45}}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: bank-a, namespace: banking}
spec: {minAvailable: 1, selector: {matchLabels: {app: bank-a}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: bank-b, namespace: banking}
spec: {minAvailable: 1, selector: {matchLabels: {app: bank-b}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway, namespace: banking}
spec: {minAvailable: 1, selector: {matchLabels: {app: gateway}}}
